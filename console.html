<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberSentinel SOC Console</title><link rel="stylesheet" href="/style.css"></head><body><header><span class="brand">CyberSentinel / SOC Console</span><a href="/demo">Browser demo</a></header><main><section class="hero"><p class="eyebrow">DEFENSIVE SECURITY / AUTHENTICATED LAB</p><h1>Security operations console</h1><p id="status" role="status">Checking session…</p></section><section id="login-panel" class="panel" hidden><h2>Sign in</h2><form id="login"><label>Email <input id="email" type="email" autocomplete="username" required></label><label>Password <input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><section id="workspace" hidden><section class="panel"><h2>Investigation workspace</h2><p id="identity"></p><button id="logout">Sign out</button><p>Import synthetic or authorized JSONL logs only.</p><label>Log file <input id="file" type="file" accept=".jsonl,.ndjson,.txt"></label><button id="ingest">Analyze and save</button></section><section class="panel"><h2>Saved investigations</h2><div id="batches"></div></section><section class="panel"><h2>Alert details</h2><div id="findings"></div></section></section></main><script type="module" src="/console.mjs"></script></body></html>
